CONFIG_MULTICHANNEL_AURACAST=y
CONFIG_TRANSPORT_BIS=y
CONFIG_AUDIO_DEV=2
CONFIG_BT_CAP_INITIATOR=y
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_AUDIO_SOURCE_USB=y
CONFIG_AUDIO_SAMPLE_RATE_48000_HZ=y
CONFIG_AUDIO_INPUT_CHANNELS=4
CONFIG_AUDIO_ENCODE_CHANNELS_MAX=4
CONFIG_LC3_ENC_CHAN_MAX=4
CONFIG_AUDIO_TEST_TONE=n
CONFIG_SAMPLE_RATE_CONVERTER=n
CONFIG_SAMPLE_RATE_CONVERTER_FILTER_SIMPLE=n
CONFIG_STREAM_BIDIRECTIONAL=n
CONFIG_MONO_TO_ALL_RECEIVERS=n

CONFIG_BT_BAP_BROADCAST_48_4_1=y
CONFIG_BT_AUDIO_CONCURRENT_TX_STREAMS_MAX=4
CONFIG_BT_BAP_BROADCAST_SRC_COUNT=1
CONFIG_BT_BAP_BROADCAST_SRC_SUBGROUP_COUNT=2
CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=4
CONFIG_BT_ISO_MAX_BIG=1
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_TX_MTU=120
CONFIG_BT_ISO_TX_BUF_COUNT=8
CONFIG_BT_CTLR_ADV_ISO_SET=1
CONFIG_BT_CTLR_ADV_ISO_STREAM_COUNT=4
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=4
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
# The two-subgroup BASE exceeds the controller's default 31-byte buffer.
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=251

CONFIG_BT_AUDIO_BROADCAST_NAME="Multichannel Auracast"
CONFIG_BT_DEVICE_NAME="Multichannel Auracast"
CONFIG_BT_DEVICE_APPEARANCE=2181
